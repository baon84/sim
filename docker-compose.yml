version: '3.8'

services:
  # Aplikasi SIM Sekolah
  sim-sekolah-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim-sekolah
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production

  # Cloudflare Tunnel (Opsional: Jika ingin tunnel berjalan langsung di dalam Docker)
  # Anda hanya perlu memasukkan TUNNEL_TOKEN dari dashboard Cloudflare Zero Trust
  # cloudflared:
